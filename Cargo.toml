[package]
name = "bevy_egui"
version = "0.35.0"
# Needed for LazyLock https://doc.rust-lang.org/stable/std/sync/struct.LazyLock.html
rust-version = "1.80.0"
authors = ["vladbat00 <vladyslav.batyrenko@gmail.com>"]
description = "A plugin for Egui integration into Bevy"
license = "MIT"
edition = "2021"
repository = "https://github.com/vladbat00/bevy_egui"
exclude = ["assets/**/*", ".github/**/*"]

[package.metadata.docs.rs]
features = ["bevy_winit/x11", "immutable_ctx"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["manage_clipboard", "open_url", "default_fonts", "render"]
accesskit_placeholder = ["egui/accesskit", "bevy_a11y"] # the feature won't compile until Egui updates its accesskit version, hence disabled by default
immutable_ctx = []
manage_clipboard = ["arboard", "thread_local", "bytemuck"]
open_url = ["webbrowser"]
default_fonts = ["egui/default_fonts"]
render = [
    "bevy_asset",
    "bevy_image",
    "bevy_render",
    "encase",
    "bytemuck",
    "egui/bytemuck",
    "wgpu-types",
]
picking = ["render", "bevy_picking"]
serde = ["egui/serde"]
# The enabled logs will print with the info log level, to make it less cumbersome to debug in browsers.
log_input_events = []
# The enabled logs will print with the info log level, to make it less cumbersome to debug in browsers.
log_file_dnd_events = []

[[example]]
name = "absorb_input"
required-features = ["render"]
[[example]]
name = "color_test"
required-features = ["render"]
[[example]]
name = "paint_callback"
required-features = ["render"]
[[example]]
name = "render_to_image_widget"
required-features = ["render"]
[[example]]
name = "run_manually"
required-features = ["render"]
[[example]]
name = "side_panel"
required-features = ["render"]
[[example]]
name = "simple"
required-features = ["render"]
[[example]]
name = "split_screen"
required-features = ["render"]
[[example]]
name = "two_windows"
required-features = ["render"]
[[example]]
name = "ui"
required-features = ["render"]
[[example]]
name = "render_egui_to_image"
required-features = ["picking", "render", "bevy/bevy_gizmos"]
[[example]]
name = "file_browse"
required-features = ["render"]

[dependencies]
bevy_app = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_app" }
bevy_a11y = {  git = "https://gitee.com/happydpc/bevy.git", package = "bevy_a11y", optional = true }
bevy_derive = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_derive" }
bevy_ecs = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_ecs" }
bevy_input = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_input" }
bevy_log = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_log" }
bevy_math = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_math" }
bevy_transform = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_transform" }
bevy_reflect = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_reflect" }
bevy_time = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_time" }
bevy_utils = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_utils" }
bevy_winit = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_winit", features = ["custom_cursor"] }
bevy_window = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_window" }
bevy_platform = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_platform" }
bevy_core_pipeline = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_core_pipeline" }

bytemuck = { version = "1", optional = true}
egui = { git = "https://gitee.com/happydpc/egui.git", default-features = false, features = ["bytemuck"] }
webbrowser = { version = "0.8.2", optional = true }
wgpu-types = { git = "https://gitee.com/happydpc/wgpu.git" , optional = true }

# `render` feature
bevy_asset = {  git = "https://gitee.com/happydpc/bevy.git", package = "bevy_asset", optional = true }
bevy_image = {  git = "https://gitee.com/happydpc/bevy.git", package = "bevy_image", optional = true }
bevy_render = {  git = "https://gitee.com/happydpc/bevy.git", package = "bevy_render", optional = true }
encase = { version = "0.10", optional = true }

# `picking` feature
bevy_picking = { git = "https://gitee.com/happydpc/bevy.git", package = "bevy_picking", optional = true }

# `manage_clipboard` feature
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
arboard = { version = "3.2.0", optional = true }
thread_local = { version = "1.1.0", optional = true }

[dev-dependencies]
version-sync = "0.9.5"
bevy = {git = "https://gitee.com/happydpc/bevy.git", default-features = false, features = [
    "accesskit_unix",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_mesh_picking_backend",
    "bevy_sprite",
    "bevy_window",
    "bevy_winit",
    "android-game-activity",
    "png",
    "std",
    "tonemapping_luts",
    "webgl2",
    "x11",
] }
egui = { git = "https://gitee.com/happydpc/egui.git" , default-features = false, features = ["bytemuck"] }


[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dev-dependencies]
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
winit = { git = "https://gitee.com/happydpc/winit.git" }
web-sys = { version = "0.3.74", features = [
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "DataTransfer",
    "Document",
    "EventTarget",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "Navigator",
    "TouchEvent",
    "Window",
] }
image = { version = "0.25.5", default-features = false, features = ["png"] } # For copying images
js-sys = "0.3.63"
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.36"
crossbeam-channel = "0.5.8"

